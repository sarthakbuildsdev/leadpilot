<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadPilot — Create account</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="card auth-card">
      <div class="brand">✦ LeadPilot<span>CLIENT MANAGEMENT</span></div>
      <h1>Create account</h1>
      <p>Your leads, follow-ups, and revenue stay attached to this login only.</p>
      <form id="authForm" data-endpoint="/api/auth/register">
        <label>Name
          <input id="name" name="name" maxlength="80" autocomplete="name" required>
        </label>
        <label>Email
          <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
        </label>
        <label>Password
          <input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        </label>
        <p class="auth-hint">Use at least 8 characters. Passwords are hashed with bcrypt and never stored in plain text.</p>
        <div class="field-error" id="formError"></div>
        <button class="primary" type="submit" id="submitBtn">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
    </section>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
